<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Signup</title>
</head>
<body>

    <h1>Signup</h1>

    <form id="signupForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">Sign Up</button>

    </form>

    <p id="message"></p>

    <script src="{{ url_for('static', filename='admin/js/signup.js') }}"></script>

</body>
</html>
